name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, package, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build web (versioned)
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          pnpm --filter @life-os/domain build
          pnpm --filter @life-os/web build

      - name: Package web artifact
        run: |
          cd apps/web/dist
          zip -r "../../../life-os-web-${{ github.ref_name }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Life OS ${{ github.ref_name }}
          generate_release_notes: true
          files: life-os-web-${{ github.ref_name }}.zip

  desktop:
    name: Desktop installer (Windows .exe/.msi)
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo (Rust deps)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @life-os/domain build
      - name: Build desktop bundles (NSIS + MSI)
        env:
          # Нативная оболочка не имеет общего origin с бэкендом — адрес API задаётся при сборке.
          # Пользователь может переопределить его в рантайме (поле «Сервер» на экране входа).
          VITE_API_BASE: http://localhost:3011/api/v1
          APP_VERSION: ${{ github.ref_name }}
        run: pnpm --filter @life-os/desktop exec tauri build --bundles nsis,msi
      - name: Collect installers
        shell: bash
        run: |
          mkdir dist-desktop
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*.exe dist-desktop/ 2>/dev/null || true
          cp apps/desktop/src-tauri/target/release/bundle/msi/*.msi dist-desktop/ 2>/dev/null || true
          ls -la dist-desktop
      - name: Attach installers to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-desktop/*

  android:
    name: Android app (.apk)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Build web for mobile
        env:
          # По умолчанию — адрес хоста для Android-эмулятора (10.0.2.2 = localhost машины).
          # На реальном устройстве адрес меняется в рантайме (поле «Сервер» на экране входа).
          VITE_API_BASE: http://10.0.2.2:3011/api/v1
          APP_VERSION: ${{ github.ref_name }}
        run: |
          pnpm --filter @life-os/domain build
          pnpm --filter @life-os/web build
      - name: Sync Capacitor (dist → android)
        run: pnpm --filter @life-os/mobile exec cap sync android
      - name: Build debug APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "life-os-${{ github.ref_name }}.apk"
      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: life-os-${{ github.ref_name }}.apk

  images:
    name: Build and push container images (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image base (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}-api:${{ github.ref_name }}
            ${{ env.IMAGE }}-api:latest
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}-web:${{ github.ref_name }}
            ${{ env.IMAGE }}-web:latest

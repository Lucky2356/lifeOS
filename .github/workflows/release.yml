name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, package, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build web (versioned)
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          pnpm --filter @life-os/domain build
          pnpm --filter @life-os/web build

      - name: Package web artifact
        run: |
          cd apps/web/dist
          zip -r "../../../life-os-web-${{ github.ref_name }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Life OS ${{ github.ref_name }}
          generate_release_notes: true
          files: life-os-web-${{ github.ref_name }}.zip

  desktop:
    name: Desktop installer (Windows .exe/.msi)
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo (Rust deps)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @life-os/domain build
      - name: Build desktop bundles (NSIS + MSI, signed for updater)
        env:
          # Адрес продакшен-сервера по умолчанию (пользователь может сменить в поле «Адрес сервера»).
          VITE_API_BASE: ${{ vars.API_BASE_URL || 'http://45.143.203.142:3011/api/v1' }}
          APP_VERSION: ${{ github.ref_name }}
          # Подпись апдейтер-артефактов. Приватный ключ — единственный секрет; пароль ключа пустой.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm --filter @life-os/desktop exec tauri build --bundles nsis,msi
      - name: Collect installers + build updater manifest (latest.json)
        shell: bash
        run: |
          mkdir dist-desktop
          NSIS_DIR=apps/desktop/src-tauri/target/release/bundle/nsis
          cp "$NSIS_DIR"/*.exe dist-desktop/ 2>/dev/null || true
          cp "$NSIS_DIR"/*.exe.sig dist-desktop/ 2>/dev/null || true
          cp apps/desktop/src-tauri/target/release/bundle/msi/*.msi dist-desktop/ 2>/dev/null || true
          # latest.json — то, что читает встроенный updater Tauri (endpoint релиза).
          VERSION="${GITHUB_REF_NAME#v}"
          SETUP=$(ls "$NSIS_DIR"/*-setup.exe | head -1)
          SIG=$(cat "$SETUP.sig")
          # Пробелы в имени файла GitHub отдаёт как точки в browser_download_url.
          URLNAME=$(basename "$SETUP" | tr ' ' '.')
          cat > dist-desktop/latest.json <<JSON
          {
            "version": "$VERSION",
            "notes": "Life OS $GITHUB_REF_NAME",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIG",
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${URLNAME}"
              }
            }
          }
          JSON
          ls -la dist-desktop
      - name: Attach installers + latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-desktop/*

  android:
    name: Android app (.apk)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Build web for mobile
        env:
          # Адрес продакшен-сервера по умолчанию (пользователь может сменить в поле «Адрес сервера»).
          VITE_API_BASE: ${{ vars.API_BASE_URL || 'http://45.143.203.142:3011/api/v1' }}
          APP_VERSION: ${{ github.ref_name }}
        run: |
          pnpm --filter @life-os/domain build
          pnpm --filter @life-os/web build
      - name: Sync Capacitor (dist → android)
        run: pnpm --filter @life-os/mobile exec cap sync android
      - name: Build debug APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK + build update manifest (mobile-update.json)
        run: |
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "life-os-${{ github.ref_name }}.apk"
          # mobile-update.json — приложение читает его на старте и предлагает установить свежий APK.
          cat > mobile-update.json <<JSON
          {
            "version": "${{ github.ref_name }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/life-os-${{ github.ref_name }}.apk",
            "notes": "Life OS ${{ github.ref_name }}"
          }
          JSON
      - name: Attach APK + manifest to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            life-os-${{ github.ref_name }}.apk
            mobile-update.json

  images:
    name: Build and push container images (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image base (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}-api:${{ github.ref_name }}
            ${{ env.IMAGE }}-api:latest
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}-web:${{ github.ref_name }}
            ${{ env.IMAGE }}-web:latest

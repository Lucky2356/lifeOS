server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API проксируется на сервис api в той же сети compose.
  location /api/ {
    proxy_pass http://api:3011;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA-фолбэк.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

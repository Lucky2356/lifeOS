# Полный стек для локального/стейджинг-развёртывания.
# Запуск: docker compose -f infra/docker/docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeos}
      POSTGRES_DB: lifeos
    volumes:
      - life-os-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lifeos -d lifeos']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://lifeos:${POSTGRES_PASSWORD:-lifeos}@db:5432/lifeos
      PORT: 3011
      # Секреты можно не задавать — API сгенерирует стойкие случайные при первом старте и сохранит
      # их в БД (уникально на установку). Для явного контроля задайте свои в infra/docker/.env:
      #   JWT_SECRET=...  ENCRYPTION_KEY=...  (напр. `openssl rand -hex 32`)
      JWT_SECRET: ${JWT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    # Порт API открыт наружу, чтобы к нему могли ходить десктоп-приложение (localhost:3011)
    # и телефон по адресу этой машины в сети (http://<IP-этого-ПК>:3011/api/v1).
    ports:
      - '3011:3011'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    # Веб на :8080 сам проксирует /api к сервису api (тот же origin) — открывайте http://localhost:8080.
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  life-os-db-data:

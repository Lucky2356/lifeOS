# Полный стек для локального/стейджинг-развёртывания.
# Запуск: docker compose -f infra/docker/docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeos}
      POSTGRES_DB: lifeos
    volumes:
      - life-os-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lifeos -d lifeos']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://lifeos:${POSTGRES_PASSWORD:-lifeos}@db:5432/lifeos
      PORT: 3011
      # Секреты можно не задавать — API сгенерирует стойкие случайные при первом старте и сохранит
      # их в БД (уникально на установку). Для явного контроля задайте свои в infra/docker/.env:
      #   JWT_SECRET=...  ENCRYPTION_KEY=...  (напр. `openssl rand -hex 32`)
      JWT_SECRET: ${JWT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Адрес веб-приложения — для ссылок сброса пароля в письмах. Укажите публичный адрес сервера.
      APP_URL: ${APP_URL:-http://45.143.203.142:8080}
      # Ужесточение CORS (необязательно): список веб-origin через запятую. Нативные приложения — всегда.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # SMTP для писем сброса пароля (напр. Brevo: smtp-relay.brevo.com:587). Без него письма не шлются.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Life OS <no-reply@lifeos.local>}
      # Каталог зашифрованных вложений (том сохраняет их между перезапусками).
      ATTACHMENTS_DIR: /data/attachments
    # Порт API открыт наружу, чтобы к нему могли ходить десктоп-приложение (localhost:3011)
    # и телефон по адресу этой машины в сети (http://<IP-этого-ПК>:3011/api/v1).
    ports:
      - '3011:3011'
    volumes:
      - life-os-attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    # Веб на :8080 сам проксирует /api к сервису api (тот же origin) — открывайте http://localhost:8080.
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  life-os-db-data:
  life-os-attachments:

# Полный стек для локального/стейджинг-развёртывания.
# Запуск: docker compose -f infra/docker/docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeos}
      POSTGRES_DB: lifeos
    volumes:
      - life-os-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lifeos -d lifeos']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://lifeos:${POSTGRES_PASSWORD:-lifeos}@db:5432/lifeos
      PORT: 3011
      # Секреты можно не задавать — API сгенерирует стойкие случайные при первом старте и сохранит
      # их в БД (уникально на установку). Для явного контроля задайте свои в infra/docker/.env:
      #   JWT_SECRET=...  ENCRYPTION_KEY=...  (напр. `openssl rand -hex 32`)
      JWT_SECRET: ${JWT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Адрес веб-приложения — для ссылок сброса пароля в письмах. По умолчанию — https://<DOMAIN>.
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      # Ужесточение CORS: по умолчанию разрешаем свой публичный домен. Нативные приложения — всегда.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${DOMAIN}}
      # SMTP для писем сброса пароля (напр. Brevo: smtp-relay.brevo.com:587). Без него письма не шлются.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Life OS <no-reply@lifeos.local>}
      # Каталог зашифрованных вложений (том сохраняет их между перезапусками).
      ATTACHMENTS_DIR: /data/attachments
    # Порт наружу НЕ пробрасываем: доступ только через Caddy (TLS) → web → api. Десктоп/телефон
    # ходят на https://<DOMAIN>/api/v1. Внутри compose-сети api доступен как api:3011.
    volumes:
      - life-os-attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    # Веб (nginx) сам проксирует /api к сервису api (тот же origin). Наружу не пробрасываем —
    # только через Caddy. Внутри сети доступен как web:80.
    depends_on:
      - api

  # TLS-терминатор и единая точка входа. Получает сертификат Let's Encrypt для $DOMAIN автоматически.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в infra/docker/.env — публичный домен, указывающий на сервер}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  life-os-db-data:
  life-os-attachments:
  caddy-data:
  caddy-config:
